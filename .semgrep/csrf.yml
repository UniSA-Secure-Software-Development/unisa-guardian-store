rules:
  - id: express-route-missing-csrf
    languages: [javascript, typescript]
    message: "写操作路由缺少 csrfProtection 中间件"
    severity: ERROR
    paths:
      include:
        - server.ts
        - routes/**/*.ts
    patterns:
      - pattern-either:
          - pattern: app.$METHOD($ROUTE, ...$MWS, $HANDLER)
          - pattern: router.$METHOD($ROUTE, ...$MWS, $HANDLER)
      - metavariable-regex:
          metavariable: METHOD
          regex: "(post|put|patch|delete)"
      - pattern-not: app.$METHOD($ROUTE, ..., csrfProtection(...), ...)
      - pattern-not: router.$METHOD($ROUTE, ..., csrfProtection(...), ...)
    metadata:
      category: security
      technology: [express]
