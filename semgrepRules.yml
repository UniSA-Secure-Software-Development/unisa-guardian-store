
rules:
  - id: sequelize-sqli
    message: "Detected SQL statement that is tainted by `$EVENT` object. This could
      lead to SQL injection if the variable is user-controlled and not properly
      sanitized. In order to prevent SQL injection, use parameterized queries or
      prepared statements instead. You can use parameterized statements like so:
      `sequelize.query('SELECT * FROM projects WHERE status = ?', {
      replacements: ['active'], type: QueryTypes.SELECT });`"
    metadata:
      references:
        - https://sequelize.org/master/manual/raw-queries.html
        - https://semgrep.dev/r?q=javascript.aws-lambda.security.sequelize-sqli.sequelize-sqli
      category: security
      owasp:
        - A01:2017 - Injection
        - A03:2021 - Injection
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL
          Command ('SQL Injection')"
      technology:
        - express
        - sequelize
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      license: Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - SQL Injection
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: req.body
          - pattern: req.query
          - pattern: req.params
          - pattern: req.cookies
          - pattern: req.headers
    pattern-sinks:
      - patterns:
          - pattern: models.sequelize.query($QUERY, ...)
