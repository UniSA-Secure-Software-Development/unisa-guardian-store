name: SQL Injection Security Test

on:
  pull_request:
    branches: [ develop ]

jobs:
  security-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run SQL injection tests
      run: npm test2