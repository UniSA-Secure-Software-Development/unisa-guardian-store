name: Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  devskim:
    name: DevSkim (Static Analysis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run DevSkim static analysis
        uses: microsoft/DevSkim-Action@v1
        with:
          directory-to-scan: .
          output-filename: devskim-results.sarif

      - name: Upload DevSkim results to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: devskim-results.sarif

      - name: Upload DevSkim SARIF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: devskim-results
          path: devskim-results.sarif

  dependencycheck:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by Dependency Check)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Dependency Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependencycheck-${{ runner.os }}
          restore-keys: dependencycheck-

      - name: Install Node dependencies (Frontend)
        working-directory: ./frontend
        run: npm install

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Guardian Store"
          path: "./frontend"
          format: "HTML"
          out: "reports"

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/**
