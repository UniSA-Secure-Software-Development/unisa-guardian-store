name: File Upload Testing

# run tests on push and pull requests
on:
  push:
    branches: [ aaron-110233224 ]
  pull_request:
    branches: [ aaron-110233224 ]

jobs:
  security-test:
    runs-on: ubuntu-latest
    
    steps:
    # code checkout
    - name: Switch to repository
      uses: actions/checkout@v3
    
    # setup node.js
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    # install dependencies
    - name: Install dependencies
      run: npm install
    
    # run the file security test
    - name: Run file upload security tests
      run: npx jest test/api/fileUploadSecuritySpec.ts --forceExit