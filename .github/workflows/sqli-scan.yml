name: SQL Injection Scan

on:
  push:  
    branches: [ main, develop ]  
  workflow_dispatch:  

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install

      - name: Start the app in background
        run: |
          npm run serve &  # Add '&' to run in background, wait for app to start
          sleep 10  # Give time for app to boot (adjust as needed)

      - name: Run sqlmap scan
        run: |
          docker run --network host \
            remnux/sqlmap \
            -u "http://localhost:3000/rest/products/search?q=test" \
            --batch --level=5 --risk=3 --dbms=sqlite \
            --flush-session

      - name: Fail if vulnerabilities found
        if: ${{ failure() }}
        run: echo "SQL injection detected - fix before merging!" && exit 1

      - name: Upload scan results  # Optional: Artifact upload like practical (page 13)
        uses: actions/upload-artifact@v4
        with:
          name: sqlmap-results
          path: .  # Or path to sqlmap output files